name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v1/package-lock.json

      - run: npm ci
        working-directory: v1

      - name: Typecheck
        run: npm run typecheck
        working-directory: v1

      - name: Test
        run: npm test
        working-directory: v1

      - name: Build
        run: npm run build
        working-directory: v1
